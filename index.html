var $=function(i){return document.getElementById(i)};
var favs={};
try{favs=JSON.parse(localStorage.getItem("sagesse-favs")||"{}")||{}}catch(e){favs={}}
function saveFavs(){try{localStorage.setItem("sagesse-favs",JSON.stringify(favs))}catch(e){}}
var key=function(i){return Q[i][0]+"|"+Q[i][2].slice(0,30)};
var sure=[];Q.forEach(function(c,i){if(!c[4])sure.push(i)});
var cur=sure[Math.floor(Date.now()/864e5)%sure.length], onlyFav=false, onlySure=false;
function note(c){var t=[];if(c[3])t.push("Source : "+c[3]);if(c[4])t.push("⚠ attribution incertaine");return t.join(" · ")}

function show(i){
  cur=i;var c=Q[i];
  $("q").textContent="« "+c[2]+" »";$("a").textContent=c[0];$("e").textContent=c[1];$("src").textContent=note(c);
  $("fav").setAttribute("aria-pressed",!!favs[key(i)]);
  $("fav").textContent=favs[key(i)]?"Gardée":"Garder";
}
function toggleFav(i){
  if(favs[key(i)])delete favs[key(i)];else favs[key(i)]=1;
  saveFavs();show(cur);renderList();
}
function renderList(){
  var t=$("s").value.trim().toLowerCase(),a=$("au").value,ul=$("list"),n=0;
  ul.innerHTML="";
  Q.forEach(function(c,i){
    if(a&&c[0]!==a)return;
    if(onlyFav&&!favs[key(i)])return;
    if(onlySure&&c[4])return;
    if(t&&(c[0]+" "+c[2]).toLowerCase().indexOf(t)<0)return;
    n++;
    var li=document.createElement("li"),p=document.createElement("p"),d=document.createElement("div"),
        s=document.createElement("span"),b=document.createElement("b"),bt=document.createElement("button");
    p.textContent="« "+c[2]+" »";
    b.textContent=c[0];s.appendChild(b);s.appendChild(document.createTextNode(" · "+c[1]));
    var nt=note(c);if(nt){var sm=document.createElement("small");sm.className="src";sm.textContent=nt;s.appendChild(document.createElement("br"));s.appendChild(sm)}
    bt.className="alt";bt.type="button";bt.textContent=favs[key(i)]?"Gardée":"Garder";
    bt.setAttribute("aria-pressed",!!favs[key(i)]);
    bt.onclick=function(){toggleFav(i)};
    p.style.cursor="pointer";p.onclick=function(){show(i);window.scrollTo({top:0,behavior:"smooth"})};
    d.appendChild(s);d.appendChild(bt);li.appendChild(p);li.appendChild(d);ul.appendChild(li);
  });
  $("count").textContent=n+" citation"+(n>1?"s":"")+" sur "+Q.length;
  $("empty").hidden=n>0;
}

var names=[];Q.forEach(function(c){if(names.indexOf(c[0])<0)names.push(c[0])});
names.sort(function(x,y){return x.localeCompare(y,"fr")}).forEach(function(n){
  var o=document.createElement("option");o.value=n;o.textContent=n;$("au").appendChild(o)});

$("next").onclick=function(){var i;do{i=sure[Math.floor(Math.random()*sure.length)]}while(i===cur&&sure.length>1);show(i)};
$("fav").onclick=function(){toggleFav(cur)};

  var c=Q[cur],txt="« "+c[2]+" » – "+c[0];

  try{navigator.clipboard.writeText(txt).then(done,function(){})}catch(e){}
};
