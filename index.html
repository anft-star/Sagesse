<!DOCTYPE html>
<!--
  Sagesse – Citations de philosophes
  © 2026 RAKOTOARISOANIRINA Anjara Fitahiana. Tous droits réservés.
  Code source : un seul fichier HTML (HTML + CSS + JavaScript), sans dépendance.
  Pour ajouter une citation : ajoute une ligne dans le tableau Q plus bas.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="RAKOTOARISOANIRINA Anjara Fitahiana">
<meta name="theme-color" content="#14263F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sagesse">
<title>Sagesse – Citations de philosophes</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#DFE5EC;--card:#F2F5F8;--ink:#14263F;--mute:#5B6B80;--line:#C3CDD9;--acc:#9A6B2F;--btn:#14263F;--btn-t:#F2F5F8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1726;--card:#16233A;--ink:#E7ECF4;--mute:#93A3BA;--line:#2A3A55;--acc:#D9A55B;--btn:#D9A55B;--btn-t:#0E1726}}
:root[data-theme="dark"]{--bg:#0E1726;--card:#16233A;--ink:#E7ECF4;--mute:#93A3BA;--line:#2A3A55;--acc:#D9A55B;--btn:#D9A55B;--btn-t:#0E1726}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Work Sans",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:22px 18px 40px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font:600 22px "Spectral",Georgia,serif;margin:0}
.hero{margin:26px 0 8px}
blockquote{margin:0;font:italic 400 clamp(24px,6.4vw,32px)/1.3 "Spectral",Georgia,serif;letter-spacing:-.01em;border-left:4px solid var(--acc);padding-left:16px}
.who{margin:14px 0 0 20px;font-weight:600}
.era{color:var(--mute);font-weight:400;font-size:14px}
.actions{display:flex;gap:8px;margin:20px 0 0;flex-wrap:wrap}
button{font:600 15px "Work Sans",sans-serif;border:1px solid var(--btn);border-radius:10px;padding:11px 14px;background:var(--btn);color:var(--btn-t);cursor:pointer}
button.alt{background:none;color:var(--ink);border-color:var(--line)}
button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:30px 0 10px}
.filters input{grid-column:1/-1}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.count{color:var(--mute);font-size:14px;margin:0 0 6px}
ul{list-style:none;margin:0;padding:0}
li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin-top:10px}
li p{margin:0 0 8px;font:400 18px/1.4 "Spectral",Georgia,serif}
li div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
li b{color:var(--ink)}
li button{padding:6px 10px;font-size:13px}
.empty{color:var(--mute)}
footer{margin-top:34px;text-align:center;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
<header><h1>Sagesse</h1><button class="alt" id="theme" type="button" aria-label="Changer de thème">Thème</button></header>

<section class="hero" aria-live="polite">
  <blockquote id="q">…</blockquote>
  <p class="who"><span id="a"></span> <span class="era" id="e"></span></p>
  <div class="actions">
    <button id="next" type="button">Autre citation</button>
    <button class="alt" id="fav" type="button" aria-pressed="false">Garder</button>
    <button class="alt" id="copy" type="button">Copier</button>
  </div>
</section>

<section class="filters" aria-label="Filtres">
  <input id="s" type="search" placeholder="Chercher un mot ou un nom…" aria-label="Rechercher">
  <select id="au" aria-label="Philosophe"><option value="">Tous les philosophes</option></select>
  <button class="alt" id="onlyFav" type="button" aria-pressed="false">Mes favorites</button>
</section>
<p class="count" id="count"></p>
<ul id="list"></ul>
<p class="empty" id="empty" hidden>Aucune citation ne correspond. Essaie un autre mot.</p>

<footer>© 2026 RAKOTOARISOANIRINA Anjara Fitahiana<br>Citations traduites ou résumées en français. Vérifie les sources avant de citer.</footer>
</main>

<script>
// ---- Données : [auteur, époque, citation] -------------------------------
var Q=[
["Héraclite","VIe s. av. J.-C.","On ne se baigne jamais deux fois dans le même fleuve."],
["Héraclite","VIe s. av. J.-C.","Tout s’écoule."],
["Lao Tseu","VIe s. av. J.-C.","Un voyage de mille lieues commence par un seul pas."],
["Confucius","Ve s. av. J.-C.","Ce que tu ne désires pas pour toi-même, ne l’impose pas aux autres."],
["Confucius","Ve s. av. J.-C.","Apprendre sans réfléchir est vain ; réfléchir sans apprendre est dangereux."],
["Protagoras","Ve s. av. J.-C.","L’homme est la mesure de toutes choses."],
["Socrate","Ve s. av. J.-C.","Connais-toi toi-même."],
["Socrate","Ve s. av. J.-C.","Une vie sans examen ne vaut pas la peine d’être vécue."],
["Socrate","Ve s. av. J.-C.","Je sais que je ne sais rien."],
["Diogène","IVe s. av. J.-C.","Je cherche un homme."],
["Platon","IVe s. av. J.-C.","L’étonnement est le commencement de la philosophie."],
["Platon","IVe s. av. J.-C.","Le commencement est la partie la plus importante de l’œuvre."],
["Aristote","IVe s. av. J.-C.","Tous les hommes désirent naturellement savoir."],
["Aristote","IVe s. av. J.-C.","L’homme est un animal politique."],
["Aristote","IVe s. av. J.-C.","La vertu se tient dans un juste milieu entre deux excès."],
["Épicure","IIIe s. av. J.-C.","La mort n’est rien pour nous."],
["Cicéron","Ier s. av. J.-C.","Philosopher, c’est apprendre à mourir."],
["Sénèque","Ier s.","Ce n’est pas que nous ayons peu de temps, c’est que nous en perdons beaucoup."],
["Sénèque","Ier s.","Ce n’est pas parce que les choses sont difficiles que nous n’osons pas ; c’est parce que nous n’osons pas qu’elles sont difficiles."],
["Épictète","Ier–IIe s.","Ce ne sont pas les choses qui troublent les hommes, mais les jugements qu’ils portent sur elles."],
["Marc Aurèle","IIe s.","Ce qui n’est pas utile à l’essaim n’est pas utile à l’abeille."],
["Marc Aurèle","IIe s.","La meilleure vengeance est de ne pas ressembler à celui qui t’a fait du tort."],
["Augustin","IVe–Ve s.","Le temps ? Si personne ne me le demande, je le sais ; si on me le demande, je ne le sais plus."],
["Montaigne","XVIe s.","Que sais-je ?"],
["Montaigne","XVIe s.","Parce que c’était lui, parce que c’était moi."],
["Descartes","XVIIe s.","Je pense, donc je suis."],
["Descartes","XVIIe s.","Le bon sens est la chose du monde la mieux partagée."],
["Pascal","XVIIe s.","Le cœur a ses raisons que la raison ne connaît point."],
["Pascal","XVIIe s.","L’homme n’est qu’un roseau, le plus faible de la nature, mais c’est un roseau pensant."],
["Pascal","XVIIe s.","Tout le malheur des hommes vient d’une seule chose : ne savoir pas demeurer en repos dans une chambre."],
["Spinoza","XVIIe s.","Ne pas rire, ne pas pleurer, ne pas détester, mais comprendre."],
["Hume","XVIIIe s.","La raison est, et ne doit être, que l’esclave des passions."],
["Voltaire","XVIIIe s.","Il faut cultiver notre jardin."],
["Rousseau","XVIIIe s.","L’homme est né libre, et partout il est dans les fers."],
["Kant","XVIIIe s.","Ose savoir ! Aie le courage de te servir de ton propre entendement."],
["Hegel","XIXe s.","La chouette de Minerve ne prend son envol qu’à la tombée de la nuit."],
["Schopenhauer","XIXe s.","La vie oscille comme un pendule entre la douleur et l’ennui."],
["Kierkegaard","XIXe s.","La vie ne peut être comprise qu’en regardant en arrière, mais elle doit être vécue en regardant en avant."],
["John Stuart Mill","XIXe s.","Mieux vaut être Socrate insatisfait qu’un imbécile satisfait."],
["Marx","XIXe s.","Les philosophes n’ont fait qu’interpréter le monde de différentes manières ; il s’agit maintenant de le transformer."],
["Nietzsche","XIXe s.","Ce qui ne me tue pas me rend plus fort."],
["Nietzsche","XIXe s.","Celui qui a un pourquoi peut supporter presque n’importe quel comment."],
["Nietzsche","XIXe s.","Il faut avoir du chaos en soi pour accoucher d’une étoile qui danse."],
["Wittgenstein","XXe s.","Les limites de mon langage signifient les limites de mon monde."],
["Thalès","VIIe–VIe s. av. J.-C.","Le plus difficile, c’est de se connaître soi-même ; le plus facile, de donner des conseils aux autres."],
["Parménide","Ve s. av. J.-C.","L’être est, le non-être n’est pas."],
["Démocrite","Ve–IVe s. av. J.-C.","Il n’existe que des atomes et du vide."],
["Bouddha","VIe–Ve s. av. J.-C.","La haine n’est jamais apaisée par la haine ; elle ne l’est que par l’absence de haine."],
["Lao Tseu","VIe s. av. J.-C.","Celui qui connaît les autres est savant ; celui qui se connaît lui-même est éclairé."],
["Lao Tseu","VIe s. av. J.-C.","Le sage n’accumule pas : plus il donne aux autres, plus il possède."],
["Confucius","Ve s. av. J.-C.","Celui qui apprend, puis repasse sans cesse ce qu’il a appris, n’est-il pas heureux ?"],
["Confucius","Ve s. av. J.-C.","Ne t’afflige pas de n’être pas connu ; afflige-toi de ne pas connaître les autres."],
["Mencius","IVe s. av. J.-C.","La bonté de la nature humaine est comme la pente naturelle de l’eau."],
["Zénon de Cition","IVe–IIIe s. av. J.-C.","Nous avons deux oreilles et une seule bouche, pour écouter deux fois plus que nous ne parlons."],
["Platon","IVe s. av. J.-C.","Aucune étude imposée par la force ne reste dans l’âme."],
["Aristote","IVe s. av. J.-C.","L’ami est un autre soi-même."],
["Aristote","IVe s. av. J.-C.","Ce que nous devons apprendre à faire, nous l’apprenons en le faisant."],
["Épicure","IIIe s. av. J.-C.","Rien n’est suffisant pour celui à qui le peu ne suffit pas."],
["Lucrèce","Ier s. av. J.-C.","Rien ne naît de rien."],
["Cicéron","Ier s. av. J.-C.","Tant qu’il y a de la vie, il y a de l’espoir."],
["Épictète","Ier–IIe s.","Il y a des choses qui dépendent de nous, et d’autres qui n’en dépendent pas."],
["Sénèque","Ier s.","Nous souffrons plus souvent en imagination que dans la réalité."],
["Sénèque","Ier s.","On doit apprendre aussi longtemps qu’on ignore, c’est-à-dire toute sa vie."],
["Marc Aurèle","IIe s.","Ce qui fait obstacle à l’action la fait avancer ; ce qui barre la route devient la route."],
["Marc Aurèle","IIe s.","Ton âme prend la couleur de tes pensées."],
["Abélard","XIIe s.","C’est en doutant que nous parvenons à la vérité."],
["Thomas d’Aquin","XIIIe s.","Garde-toi de l’homme d’un seul livre."],
["Machiavel","XVIe s.","Il vaut mieux être craint qu’aimé, si l’on ne peut être les deux."],
["Érasme","XVIe s.","On ne naît pas homme, on le devient."],
["Bacon","XVIIe s.","Savoir, c’est pouvoir."],
["La Boétie","XVIe s.","Soyez résolus à ne plus servir, et vous voilà libres."],
["Rabelais","XVIe s.","Science sans conscience n’est que ruine de l’âme."],
["Montaigne","XVIe s.","Je n’ai pas plus fait mon livre que mon livre ne m’a fait."],
["Hobbes","XVIIe s.","L’homme est un loup pour l’homme."],
["Descartes","XVIIe s.","Il faut, une fois dans sa vie, mettre toutes choses en doute autant qu’il se peut."],
["Leibniz","XVIIe–XVIIIe s.","Ce monde est le meilleur des mondes possibles."],
["Pascal","XVIIe s.","L’homme passe infiniment l’homme."],
["Spinoza","XVIIe s.","Le désir est l’essence même de l’homme."],
["La Rochefoucauld","XVIIe s.","Nous avons tous assez de force pour supporter les maux d’autrui."],
["Vauvenargues","XVIIIe s.","Les grandes pensées viennent du cœur."],
["Montesquieu","XVIIIe s.","Pour qu’on ne puisse abuser du pouvoir, il faut que le pouvoir arrête le pouvoir."],
["Voltaire","XVIIIe s.","Le doute n’est pas une condition agréable, mais la certitude est absurde."],
["Rousseau","XVIIIe s.","Tout est bien sortant des mains de l’auteur des choses ; tout dégénère entre les mains de l’homme."],
["Kant","XVIIIe s.","Deux choses remplissent l’esprit d’admiration : le ciel étoilé au-dessus de moi et la loi morale en moi."],
["Bentham","XVIIIe–XIXe s.","Le plus grand bonheur du plus grand nombre."],
["Feuerbach","XIXe s.","L’homme est ce qu’il mange."],
["Emerson","XIXe s.","Être grand, c’est être incompris."],
["Thoreau","XIXe s.","La plupart des hommes mènent une vie de désespoir tranquille."],
["Proudhon","XIXe s.","La propriété, c’est le vol."],
["Schopenhauer","XIXe s.","Chacun prend les limites de son propre champ de vision pour les limites du monde."],
["Kierkegaard","XIXe s.","L’angoisse est le vertige de la liberté."],
["Nietzsche","XIXe s.","Dieu est mort."],
["Nietzsche","XIXe s.","Deviens ce que tu es."],
["Nietzsche","XIXe s.","Sans la musique, la vie serait une erreur."],
["William James","XIXe–XXe s.","Crois que la vie vaut la peine d’être vécue, et ta croyance aidera à créer ce fait."],
["Bergson","XXe s.","Le rire a besoin d’un écho."],
["Santayana","XXe s.","Ceux qui ne se souviennent pas du passé sont condamnés à le répéter."],
["Whitehead","XXe s.","Toute la philosophie occidentale n’est guère qu’une suite de notes en bas de page de Platon."],
["Wittgenstein","XXe s.","Ce dont on ne peut parler, il faut le taire."]
];
// ---- Application ---------------------------------------------------------
var $=function(i){return document.getElementById(i)};
var favs={};
try{favs=JSON.parse(localStorage.getItem("sagesse-favs")||"{}")||{}}catch(e){favs={}}
function saveFavs(){try{localStorage.setItem("sagesse-favs",JSON.stringify(favs))}catch(e){}}
var key=function(i){return Q[i][0]+"|"+Q[i][2].slice(0,30)};
var cur=Math.floor(Date.now()/864e5)%Q.length, onlyFav=false;

function show(i){
  cur=i;var c=Q[i];
  $("q").textContent="« "+c[2]+" »";$("a").textContent=c[0];$("e").textContent=c[1];
  $("fav").setAttribute("aria-pressed",!!favs[key(i)]);
  $("fav").textContent=favs[key(i)]?"Gardée":"Garder";
}
function toggleFav(i){
  if(favs[key(i)])delete favs[key(i)];else favs[key(i)]=1;
  saveFavs();show(cur);renderList();
}
function renderList(){
  var t=$("s").value.trim().toLowerCase(),a=$("au").value,ul=$("list"),n=0;
  ul.innerHTML="";
  Q.forEach(function(c,i){
    if(a&&c[0]!==a)return;
    if(onlyFav&&!favs[key(i)])return;
    if(t&&(c[0]+" "+c[2]).toLowerCase().indexOf(t)<0)return;
    n++;
    var li=document.createElement("li"),p=document.createElement("p"),d=document.createElement("div"),
        s=document.createElement("span"),b=document.createElement("b"),bt=document.createElement("button");
    p.textContent="« "+c[2]+" »";
    b.textContent=c[0];s.appendChild(b);s.appendChild(document.createTextNode(" · "+c[1]));
    bt.className="alt";bt.type="button";bt.textContent=favs[key(i)]?"Gardée":"Garder";
    bt.setAttribute("aria-pressed",!!favs[key(i)]);
    bt.onclick=function(){toggleFav(i)};
    p.style.cursor="pointer";p.onclick=function(){show(i);window.scrollTo({top:0,behavior:"smooth"})};
    d.appendChild(s);d.appendChild(bt);li.appendChild(p);li.appendChild(d);ul.appendChild(li);
  });
  $("count").textContent=n+" citation"+(n>1?"s":"")+" sur "+Q.length;
  $("empty").hidden=n>0;
}
// Liste des philosophes
var names=[];Q.forEach(function(c){if(names.indexOf(c[0])<0)names.push(c[0])});
names.sort(function(x,y){return x.localeCompare(y,"fr")}).forEach(function(n){
  var o=document.createElement("option");o.value=n;o.textContent=n;$("au").appendChild(o)});

$("next").onclick=function(){var i;do{i=Math.floor(Math.random()*Q.length)}while(i===cur&&Q.length>1);show(i)};
$("fav").onclick=function(){toggleFav(cur)};
$("copy").onclick=function(){
  var c=Q[cur],txt="« "+c[2]+" » – "+c[0];
  var done=function(){$("copy").textContent="Copiée";setTimeout(function(){$("copy").textContent="Copier"},1500)};
  try{navigator.clipboard.writeText(txt).then(done,function(){})}catch(e){}
};
$("s").oninput=renderList;$("au").onchange=renderList;
$("onlyFav").onclick=function(){onlyFav=!onlyFav;this.setAttribute("aria-pressed",onlyFav);renderList()};
$("theme").onclick=function(){
  var r=document.documentElement,dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark");
};
show(cur);renderList();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("service-worker.js").catch(function(){})})}
</script>
</body>
</html>
